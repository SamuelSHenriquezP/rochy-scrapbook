name: rochy
description: "Rochy — Lienzo Bento Scrapbook editorial, táctil y offline-first."
publish_to: "none"
version: 1.0.4+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_staggered_grid_view: ^0.7.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  just_audio: ^0.9.40
  local_auth: ^2.3.0
  path_provider: ^2.1.4
  record: ^6.0.0
  shared_preferences: ^2.3.2
  video_player: ^2.9.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2
  http: ^1.6.0
  web: ^1.1.1
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.8
  url_launcher: ^6.3.2
  archive: ^4.7.1
  file_picker: ^13.4.0
  share_plus: ^13.3.1
  google_sign_in: ^6.2.2
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/rochy_icon.png"
  adaptive_icon_background: "#FAF6F0"
  adaptive_icon_foreground: "assets/icon/rochy_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/rochy_icon.png
